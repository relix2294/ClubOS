name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ТЗ §30: lint -> unit -> integration -> build (+ Windows runner для Agent) -> e2e smoke.
jobs:
  dotnet:
    name: .NET build, unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore ClubOS.slnx
      - name: Format check (whitespace/style)
        run: dotnet format whitespace ClubOS.slnx --verify-no-changes --no-restore
      - name: Build (Release, warnings as errors; Windows-проекты через EnableWindowsTargeting)
        run: dotnet build ClubOS.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/unit/ClubOS.Unit.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx"
      - name: Integration tests (PostgreSQL 18 via Testcontainers)
        run: dotnet test tests/integration/ClubOS.Integration.Tests.csproj -c Release --no-build --logger "trx;LogFileName=integration.trx"
      - name: EF migrations are up to date
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project services/cloud-api --no-build --configuration Release
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/*.trx"

  admin-web:
    name: Admin Web lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Windows Agent и Edge (сервер клуба на Windows) собираются и запускаются на Windows runner (ТЗ §5 п.10, §30).
  windows-agent:
    name: Windows build (Agent + Edge, windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish Agent Service + SessionHost
        shell: pwsh
        run: |
          dotnet publish services/windows-agent/ClubOS.Agent.Service/ClubOS.Agent.Service.csproj -c Release -r win-x64 --self-contained false -o out/agent
          dotnet publish services/windows-agent/ClubOS.Agent.SessionHost/ClubOS.Agent.SessionHost.csproj -c Release -r win-x64 --self-contained false -o out/agent
          Copy-Item services/windows-agent/install/*.ps1 out/agent/
      - name: Publish self-contained package (no .NET install needed on the PC)
        shell: pwsh
        run: |
          dotnet publish services/windows-agent/ClubOS.Agent.Service/ClubOS.Agent.Service.csproj -c Release -r win-x64 --self-contained true -o out/agent-sc
          dotnet publish services/windows-agent/ClubOS.Agent.SessionHost/ClubOS.Agent.SessionHost.csproj -c Release -r win-x64 --self-contained true -o out/agent-sc
          Copy-Item services/windows-agent/install/*.ps1 out/agent-sc/
      - name: Smoke-start service in console mode
        shell: pwsh
        run: |
          # Проверяем, что exe запускается на Windows (без Edge: enrollment не удастся, но процесс должен жить).
          $p = Start-Process -FilePath out/agent-sc/ClubOS.Agent.Service.exe -ArgumentList '--Agent:DataPath', "$env:RUNNER_TEMP\agent-smoke" -PassThru -NoNewWindow
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "ClubOS.Agent.Service завершился с кодом $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Smoke Player Shell (hash-pin, Enforced mode)
        shell: pwsh
        run: |
          $hash = '246810' | & out/agent-sc/ClubOS.Agent.Service.exe hash-pin
          if ($LASTEXITCODE -ne 0 -or -not ([string]$hash).StartsWith('pbkdf2-sha256$')) { throw "hash-pin: '$hash' (код $LASTEXITCODE)" }
          '12' | & out/agent-sc/ClubOS.Agent.Service.exe hash-pin
          if ($LASTEXITCODE -eq 0) { throw 'hash-pin принял слишком короткий PIN' }
          # Enforced: запускаются Player Shell и сторож SessionHost; без Edge и без прав SYSTEM процесс должен жить.
          $p = Start-Process -FilePath out/agent-sc/ClubOS.Agent.Service.exe -PassThru -NoNewWindow -ArgumentList `
            '--Agent:DataPath', "$env:RUNNER_TEMP\agent-shell", '--Agent:Shell:Mode', 'Enforced', '--Agent:Shell:TechnicianPinHash', ([string]$hash).Trim()
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "ClubOS.Agent.Service (Enforced) завершился с кодом $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          # Раннер завершает pwsh-шаг с $LASTEXITCODE; последним был намеренно неверный PIN (код 1).
          exit 0
      - name: Unit tests on Windows (SQLite store, DPAPI, agent core)
        run: dotnet test tests/unit/ClubOS.Unit.Tests.csproj -c Release
      - name: Publish Edge Controller + edge-cli (self-contained)
        shell: pwsh
        run: |
          dotnet publish services/edge-controller/ClubOS.EdgeController.csproj -c Release -r win-x64 --self-contained true -o out/edge
          dotnet publish services/edge-cli/ClubOS.EdgeCli.csproj -c Release -r win-x64 --self-contained true -o out/edge
          Copy-Item services/edge-controller/install/*.ps1 out/edge/
      - name: Smoke-start Edge (health + edge-cli)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'edge-smoke'
          # Cloud недоступен (порт 9): Edge должен работать локально, enrollment ждёт токен.
          $p = Start-Process -FilePath out/edge/ClubOS.EdgeController.exe -ArgumentList '--Edge:DataPath', $data, '--Edge:CloudUrl', 'http://127.0.0.1:9' -PassThru -NoNewWindow
          $health = $null
          for ($i = 0; $i -lt 30 -and -not $health; $i++) {
            Start-Sleep -Seconds 1
            try { $health = Invoke-RestMethod -Uri http://localhost:7070/health -TimeoutSec 2 } catch { }
          }
          if (-not $health) { throw 'Edge не ответил на /health' }
          $health | Format-List
          & out/edge/edge-cli.exe status --data $data
          if ($LASTEXITCODE -ne 0) { throw "edge-cli status завершился с кодом $LASTEXITCODE" }
          if ($p.HasExited) { throw "Edge завершился с кодом $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Upload Edge package
        uses: actions/upload-artifact@v4
        with:
          name: clubos-edge-windows
          path: out/edge
      - name: Upload agent package
        uses: actions/upload-artifact@v4
        with:
          name: clubos-windows-agent
          path: out/agent
      - name: Upload self-contained agent package
        uses: actions/upload-artifact@v4
        with:
          name: clubos-windows-agent-selfcontained
          path: out/agent-sc

  e2e:
    name: E2E smoke (docker compose + simulator + Playwright)
    runs-on: ubuntu-latest
    needs: [dotnet, admin-web]
    env:
      CLUBOS_DB_PASSWORD: ci-db-password
      CLUBOS_AUTH_SIGNING_KEY: ci-signing-key-0123456789abcdefghijklmnop
      CLUBOS_SEED_OWNER_EMAIL: owner@demo.clubos.local
      CLUBOS_SEED_OWNER_PASSWORD: ci-owner-password
      CLUBOS_DEV_EDGE_ENROLLMENT_TOKEN: ci0edge0enrollment0token0000000000000000
    steps:
      - uses: actions/checkout@v4
      - name: Validate VPS compose and Caddyfile
        run: |
          cp infrastructure/vps/.env.example infrastructure/vps/.env
          docker compose -f infrastructure/vps/docker-compose.yml config -q
          docker compose -f infrastructure/vps/docker-compose.yml --profile demo config -q
          docker run --rm -v "$PWD/infrastructure/vps/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e CLUBOS_DOMAIN=localhost -e CLUBOS_ACME_EMAIL=ci@example.tj caddy:2 caddy validate --config /etc/caddy/Caddyfile
          rm infrastructure/vps/.env
      - name: Start stack
        run: |
          docker compose up -d --build --wait postgres cloud-api admin-web
          docker compose up -d --build edge-controller
          docker compose --profile simulator up -d --build device-simulator
      - name: Wait for 5 simulated devices online
        run: |
          TOKEN=$(curl -sf -X POST localhost:5080/api/v1/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"$CLUBOS_SEED_OWNER_EMAIL\",\"password\":\"$CLUBOS_SEED_OWNER_PASSWORD\"}" | jq -r .accessToken)
          for i in $(seq 1 60); do
            N=$(curl -sf localhost:5080/api/v1/locations/loc_dushanbe_pilot/devices -H "Authorization: Bearer $TOKEN" | jq '[.[] | select(.status=="Idle")] | length')
            echo "online: $N"; [ "$N" = "5" ] && exit 0; sleep 3
          done
          docker compose logs --tail=100; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        working-directory: apps/admin-web
        env:
          E2E_PASSWORD: ${{ env.CLUBOS_SEED_OWNER_PASSWORD }}
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Stack logs
        if: failure()
        run: docker compose --profile simulator logs --tail=200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/admin-web/playwright-report
