name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Сборка и unit/contract-тесты backend (ТЗ §30: lint -> unit -> build).
  dotnet:
    name: .NET build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore ClubOS.slnx
      - name: Build (Release, warnings as errors)
        run: dotnet build ClubOS.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/unit/ClubOS.Unit.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/*.trx"

  # Windows Agent должен компилироваться на Windows runner (ТЗ §5 п.10, §30).
  # Джоб включится, когда появится проект services/windows-agent (сейчас — заглушка-скип).
  windows-agent:
    name: Windows Agent build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project presence
        id: check
        shell: bash
        run: |
          if [ -f services/windows-agent/*.csproj ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Setup .NET 10
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build Windows Agent
        if: steps.check.outputs.exists == 'true'
        run: dotnet build services/windows-agent -c Release
      - name: Skip note
        if: steps.check.outputs.exists != 'true'
        run: echo "windows-agent project не создан — пропуск (см. docs/M0_FILE_PLAN.md)."
