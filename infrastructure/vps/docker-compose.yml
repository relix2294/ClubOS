# ClubOS — Cloud-часть на VPS (Linux): PostgreSQL + Cloud API + Admin Web за Caddy с HTTPS.
# Edge Controller сюда НЕ входит: он ставится в клубе (Windows-служба), см. docs/runbooks/edge-windows-install.md.
#
#   cd infrastructure/vps && cp .env.example .env && nano .env
#   docker compose up -d --build
#
# Демо-зал для теста без железа (Edge + 5 SIMULATED ПК в отдельной локации «Демо-зал (симулятор)»):
#   задайте CLUBOS_DEMO_SECRET в .env, затем
#   docker compose --profile demo up -d --build
#
# Наружу открыты только 80/443 (Caddy). База и Cloud API доступны лишь внутри docker-сети.

name: clubos-cloud

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: clubos
      POSTGRES_USER: clubos
      POSTGRES_PASSWORD: ${CLUBOS_DB_PASSWORD:?задайте CLUBOS_DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubos -d clubos"]
      interval: 5s
      timeout: 3s
      retries: 20

  cloud-api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/cloud-api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CLUBOS_ConnectionStrings__ClubOs: Host=postgres;Port=5432;Database=clubos;Username=clubos;Password=${CLUBOS_DB_PASSWORD}
      CLUBOS_Auth__SigningKey: ${CLUBOS_AUTH_SIGNING_KEY:?задайте CLUBOS_AUTH_SIGNING_KEY в .env}
      # Seed создаёт организацию/локацию/зоны и первого Owner при первом запуске; повторно ничего не дублирует.
      # MFA (TOTP) обязательна для этих ролей: после входа без MFA доступна только её настройка.
      CLUBOS_Auth__MfaRequiredRoles: ${CLUBOS_MFA_REQUIRED_ROLES-Owner,Admin}
      CLUBOS_Seed__Enabled: "true"
      CLUBOS_Seed__OwnerEmail: ${CLUBOS_OWNER_EMAIL:?задайте CLUBOS_OWNER_EMAIL в .env}
      CLUBOS_Seed__OwnerPassword: ${CLUBOS_OWNER_PASSWORD:?задайте CLUBOS_OWNER_PASSWORD в .env}
      CLUBOS_Seed__OwnerDisplayName: ${CLUBOS_OWNER_NAME:-Владелец}
      CLUBOS_Seed__OrganizationName: ${CLUBOS_ORGANIZATION_NAME:-Demo Club Group}
      CLUBOS_Seed__LocationName: ${CLUBOS_LOCATION_NAME:-Dushanbe Pilot}
      # Демо-зал (профиль demo): отдельная локация и одноразовые токены её Edge и симулированных ПК.
      CLUBOS_Seed__DemoSecret: ${CLUBOS_DEMO_SECRET:-}
      # Подпись тела запросов Edge (D-007). false — только на время перехода, пока в клубе старый Edge (до M1 TLS).
      CLUBOS_Pki__RequireEdgeRequestBinding: ${CLUBOS_REQUIRE_EDGE_BINDING:-true}
      # Cloud API доступен только через Caddy — доверяем X-Forwarded-* (реальный IP для rate limit).
      CLUBOS_Proxy__TrustForwardedHeaders: "true"
    volumes:
      - devca:/data/dev-ca   # dev CA: ОБЯЗАТЕЛЬНО в бэкап (потеря = перерегистрация всех Edge и ПК)
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 3s
      retries: 30

  admin-web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/admin-web.Dockerfile
    restart: unless-stopped
    depends_on:
      cloud-api:
        condition: service_healthy
    environment:
      CLUBOS_CLOUD_API_URL: http://cloud-api:8080
      CLUBOS_COOKIE_SECURE: "true"

  # Пакеты для Windows (Edge и Agent, self-contained) — https://<домен>/downloads/. Собираются из этой же версии кода.
  downloads:
    build:
      context: ../..
      dockerfile: infrastructure/docker/downloads.Dockerfile
      args:
        CLUBOS_VERSION: ${CLUBOS_VERSION:-dev}
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - admin-web
      - cloud-api
      - downloads
    environment:
      CLUBOS_DOMAIN: ${CLUBOS_DOMAIN:?задайте CLUBOS_DOMAIN в .env}
      CLUBOS_ACME_EMAIL: ${CLUBOS_ACME_EMAIL:?задайте CLUBOS_ACME_EMAIL в .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # ---------- Профиль demo: демо-зал без железа ----------
  # Edge и симулятор живут во внутренней docker-сети (порты наружу не открыты). Симулятор ходит к Edge по HTTP 7070:
  # сеть внутренняя, а отпечаток CA без входа сотрудника (2FA) ему не получить. Настоящие ПК клуба — только HTTPS 7443.
  edge-demo:
    profiles: ["demo"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/edge-controller.Dockerfile
    restart: unless-stopped
    depends_on:
      cloud-api:
        condition: service_healthy
    environment:
      CLUBOS_Edge__CloudUrl: http://cloud-api:8080
      CLUBOS_Edge__EnrollmentToken: ${CLUBOS_DEMO_SECRET:-}-edge
      CLUBOS_Edge__TlsHostNames: edge-demo
    volumes:
      - edgedemo:/data/edge

  simulator-demo:
    profiles: ["demo"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/device-simulator.Dockerfile
    restart: unless-stopped
    depends_on:
      - edge-demo
    environment:
      CLUBOS_SIM_EDGE_URL: http://edge-demo:7070
      CLUBOS_SIM_CLOUD_URL: http://cloud-api:8080
      CLUBOS_SIM_DEMO_SECRET: ${CLUBOS_DEMO_SECRET:-}
      CLUBOS_SIM_SHELL: Enforced
    volumes:
      - simdemo:/data/sim
    stdin_open: true
    tty: true

  # Бездисковые ПК демо-зала (D-018): 3 ПК без токенов — появляются в «Ожидают подтверждения», после
  # подтверждения получают сертификат у Edge. Перезапуск контейнера = перезагрузка ПК (новый ключ, тот же ПК).
  simulator-diskless:
    profiles: ["demo"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/device-simulator.Dockerfile
    restart: unless-stopped
    depends_on:
      - edge-demo
    environment:
      CLUBOS_SIM_EDGE_URL: http://edge-demo:7070
      CLUBOS_SIM_CLOUD_URL: http://cloud-api:8080
      CLUBOS_SIM_DISKLESS: "true"
      CLUBOS_SIM_COUNT: "3"
      CLUBOS_SIM_SHELL: Enforced
    stdin_open: true
    tty: true

volumes:
  pgdata:
  devca:
  caddy_data:
  caddy_config:
  edgedemo:
  simdemo:
